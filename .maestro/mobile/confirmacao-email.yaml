appId: ${MAESTRO_E2E_APP_ID}
name: Confirmação de email
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS|Continue|Connected to expo-cli|Muvit needs permissions.*|Entrar"
    timeout: 120000
- openLink: ${MAESTRO_EXPO_URL}
- extendedWaitUntil:
    visible: "Continue|Connected to expo-cli|Muvit needs permissions.*|Entrar"
    timeout: 120000
- runFlow: expo-overlays.yaml
- extendedWaitUntil:
    visible: Entrar
    timeout: 120000
- tapOn: Criar conta independente
- tapOn:
    id: signup-name
- inputText: ${MAESTRO_E2E_VERIFICATION_NAME}
- tapOn:
    id: signup-email
- inputText: ${MAESTRO_E2E_VERIFICATION_EMAIL}
- hideKeyboard
- tapOn:
    id: signup-password
- inputText: ${MAESTRO_E2E_VERIFICATION_PASSWORD}
- hideKeyboard
- tapOn:
    id: signup-submit
- extendedWaitUntil:
    visible: Confirme seu email
    timeout: 30000
- tapOn: Enviar link
- assertVisible: Se houver uma conta pendente com esse email, um link de confirmação será enviado.
- assertVisible: 'Aguarde.*s'
- openLink: muvit://verify-email?error=INVALID_TOKEN
- assertVisible: Este link é inválido ou expirou. Solicite outro link.
- assertVisible: Confirme seu email
