appId: ${MAESTRO_E2E_APP_ID}
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "DEVELOPMENT SERVERS|Continue|Connected to expo-cli|Muvit needs permissions.*|Entrar"
    timeout: 120000
- openLink: ${MAESTRO_EXPO_URL}
- extendedWaitUntil:
    visible: "Continue|Connected to expo-cli|Muvit needs permissions.*|Entrar"
    timeout: 120000
- runFlow: expo-overlays.yaml
- extendedWaitUntil:
    visible: Entrar
    timeout: 120000
- runFlow: expo-overlays.yaml
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: login-email
- tapOn:
    id: login-email
    waitToSettleTimeoutMs: 5000
- tapOn:
    id: login-email
- assertVisible:
    id: login-email
    focused: true
- inputText: ${E2E_EMAIL}
- assertVisible:
    id: login-email
    text: ${E2E_EMAIL}
- tapOn:
    id: login-password
    point: "50%,50%"
- assertVisible:
    id: login-password
    focused: true
- inputText: ${E2E_PASSWORD}
- pressKey: Back
- assertVisible:
    text: Entrar
    below: Senha
- tapOn:
    text: Entrar
    below: Senha
- runFlow: expo-overlays.yaml
- extendedWaitUntil:
    visible: ${E2E_HOME}
    timeout: 30000
