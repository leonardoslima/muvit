name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muvit
          POSTGRES_PASSWORD: muvit
          POSTGRES_DB: muvit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muvit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://muvit:muvit@localhost:5432/muvit_test
      NODE_ENV: test
      API_PORT: 3333
      JWT_SECRET: ci-secret-ci-secret-ci-secret-32
      WEB_URL: http://localhost:3000
      R2_ACCOUNT_ID: ci-account
      R2_ACCESS_KEY_ID: ci-access-key
      R2_SECRET_ACCESS_KEY: ci-secret-key
      R2_BUCKET: muvit-ci
      R2_PUBLIC_URL: http://localhost:3000/uploads
      RESEND_API_KEY: ci-resend-key
      EMAIL_FROM: Muvit CI <noreply@muvit.test>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create CI env files
        run: |
          cat > packages/db/.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          EOF
          cat > packages/db/.env.test <<EOF
          DATABASE_URL=${DATABASE_URL}
          EOF
          cat > apps/api/.env.test <<EOF
          NODE_ENV=test
          API_PORT=${API_PORT}
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          WEB_URL=${WEB_URL}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET=${R2_BUCKET}
          R2_PUBLIC_URL=${R2_PUBLIC_URL}
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM=noreply@muvit.test
          EOF
      - run: pnpm -F @muvit/db migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm build
